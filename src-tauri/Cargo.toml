[package]
name = "remote-dev-bridge"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "remote-dev-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
russh = "0.58"
russh-sftp = "2.1"
async-trait = "0.1"
arboard = "3"

[profile.release]
# No `panic = "abort"`: a panic inside a tool handler must be catchable and
# returned as a JSON-RPC error instead of killing the bridge.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
